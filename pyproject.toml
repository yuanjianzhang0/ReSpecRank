[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "respecrank"
version = "0.1.0"
description = "Regime-adaptive joint time-graph spectral filtering for stock ranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
respecrank-prepare = "respecrank.cli.prepare:main"
respecrank-train = "respecrank.cli.train:main"
respecrank-evaluate = "respecrank.cli.evaluate:main"
respecrank-diagnose = "respecrank.cli.diagnose:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
